name: Build real-photo Vietnam PDF

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core poppler-utils
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow reportlab playwright
          python -m playwright install --with-deps chromium
      - name: Prepare data and builder
        run: |
          cat data.part.00 data.part.01 data.part.02 data.part.03 > vietnam_data.json
          python -m json.tool vietnam_data.json >/dev/null
          python -m json.tool source_pages.json >/dev/null
          cat core.part.00 core.part.01 > build_vietnam_pdf.py
          sed -i '$d' build_vietnam_pdf.py
          cat local_photo_patch.py >> build_vietnam_pdf.py
          python -m py_compile build_vietnam_pdf.py scrape_images.py
      - name: Capture exact real photos
        id: capture
        continue-on-error: true
        run: python scrape_images.py
      - name: Build PDF
        id: build
        continue-on-error: true
        env:
          OUT_DIR: output
        run: python build_vietnam_pdf.py
      - name: Inspect PDF
        if: always()
        run: |
          ls -lh output preset || true
          pdfinfo output/Vietnam_14_Days_REAL_Photos_RU.pdf || true
          grep -c 'MISSING' output/photo_report.csv || true
          cat preset/capture_report.csv || true
          sed -n '1,80p' output/photo_report.csv || true
      - name: Upload deliverable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vietnam-real-photo-pdf
          path: |
            output/Vietnam_14_Days_REAL_Photos_RU.pdf
            output/photo_report.csv
            preset/capture_report.csv
          if-no-files-found: error
          compression-level: 6
      - name: Fail if incomplete
        if: steps.capture.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
